version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: skylab
      POSTGRES_DB: dotnet_db
    #ports:
    #  - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - skynet

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
   # ports:
   #   - "6379:6379"
    networks:
      - skynet

  api:
    container_name: dotnet-api
    build:
      context: ./src
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      CONNECTION_STRING: "Host=postgres;Port=5432;Database=dotnet_db;Username=admin;Password=skylab"
      ALLOWED_ORIGIN: "http://localhost:5000"
      Redis__ConnectionString: "redis:6379"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"

      Spring__Application__Name: "DotnetApi"
      Eureka__Client__ServiceUrl: "http://eureka-server:8761/eureka/"
      Eureka__Client__ValidateCertificates: "false"
      Eureka__Instance__PreferIpAddress: "true"

      Keycloak__TokenUrl: "${KEYCLOAK_TOKEN_URL}"
      Keycloak__ClientId: "${KEYCLOAK_CLIENT_ID}"
      Keycloak__ClientSecret: "${KEYCLOAK_CLIENT_SECRET}"

      FormMail__FormCopyTemplateId: "${FORMMAIL_FORM_COPY_TEMPLATE_ID}"
      FormMail__StatusChangedTemplateId: "${FORMMAIL_STATUS_CHANGED_TEMPLATE_ID}"
      FormMail__PendingReminderTemplateId: "${FORMMAIL_PENDING_REMINDER_TEMPLATE_ID}"
    #ports:
    #  - "5000:8080"   # Host: 5000, Container: 8080
    restart: unless-stopped
    networks:
      - skynet

volumes:
  pgdata:

networks:
  skynet:
    external: true
